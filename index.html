
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedConnect 31 | Cloud Medical System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Ubuntu', sans-serif; 
            background-color: #f4f7f6;
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .animate-stagger-1 { animation: fadeIn 0.5s ease forwards; opacity: 0; animation-delay: 0.1s; }
        .animate-stagger-2 { animation: fadeIn 0.5s ease forwards; opacity: 0; animation-delay: 0.2s; }
        .animate-stagger-3 { animation: fadeIn 0.5s ease forwards; opacity: 0; animation-delay: 0.3s; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hover-card:hover {
            transform: translateY(-5px) scale(1.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #017E84;
            border-radius: 10px;
        }
    </style>
